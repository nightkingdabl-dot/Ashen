name: Build ASHEN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack Android project
        run: |
          set -e

          rm -rf project
          mkdir -p project

          echo "Files in repository:"
          ls -lah

          OUTER_ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$OUTER_ZIP" ]; then
            echo "ERROR: No ZIP file found in repository"
            exit 1
          fi

          echo "Outer ZIP: $OUTER_ZIP"

          unzip -q "$OUTER_ZIP" -d project

          echo ""
          echo "After unpacking outer ZIP:"
          find project -maxdepth 3 -type f | sort

          INNER_ZIP=$(find project -type f -iname "*.zip" -print -quit)

          if [ -n "$INNER_ZIP" ]; then
            echo ""
            echo "Found inner ZIP: $INNER_ZIP"

            mkdir -p project/android_project
            unzip -q "$INNER_ZIP" -d project/android_project

            echo ""
            echo "Android project extracted:"
            find project/android_project -maxdepth 4 -type f | sort | head -150
          else
            echo ""
            echo "No inner ZIP found. Using outer ZIP contents."
          fi

      - name: Find project root
        run: |
          set -e

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            echo ""
            echo "All files found:"
            find project -maxdepth 7 -type f | sort
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo ""
          echo "======================================"
          echo "Android project root:"
          echo "$ROOT"
          echo "======================================"

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Building Android project..."
          gradle assembleDebug --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASHEN-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

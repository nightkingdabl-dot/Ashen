name: Build ASHEN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack Android project
        run: |
          set -e
          rm -rf project
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No Android project ZIP found"
            ls -la
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -q "$ZIP" -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | sort | head -150

      - name: Find project root
        run: |
          set -e
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find project -maxdepth 7 -type f | sort
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASHEN-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
